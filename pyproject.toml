[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "romanizerth"
version = "0.1.0"
description = "A custom Thai-to-Roman transliteration system"
readme = "README.md"
requires-python = ">=3.10"
[project.scripts]
romanizerth = "romanizer_th.__main__:main"

[tool.setuptools.packages.find]
include = ["romanizer_th*"]
